<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Gemini Image Studio</h1>
                    <p class="text-[11px] text-slate-400">AI 画像生成 & アダプティブエディタ</p>
                </div>
            </div>
            <button id="openApiKeyModal" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700/50 flex items-center space-x-1.5 transition">
                <i class="fa-solid fa-key text-indigo-400"></i>
                <span>APIキー設定</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Controls Panel -->
        <section class="lg:col-span-1 space-y-4 bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl h-fit">
            <h2 class="text-xs font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-400"></i> 生成設定
            </h2>

            <!-- Prompt -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">プロンプト (指示文)</label>
                <textarea id="promptInput" rows="3" placeholder="例: 明治大学の武道館での卒業式、満開の桜..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
            </div>

            <!-- Style Preset -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">画風スタイル</label>
                <select id="styleSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">指定なし (標準)</option>
                    <option value="photorealistic, highly detailed, 8k resolution, cinematic lighting">フォトリアル (実写風)</option>
                    <option value="anime style, vibrant colors, clean lines, high quality">アニメ調</option>
                    <option value="watercolor painting, soft brush strokes, artistic">水彩画風</option>
                    <option value="oil painting, textured canvas, classical art style">油絵風</option>
                    <option value="3d render, blender, cute claymation style">3Dレンダリング</option>
                </select>
            </div>

            <!-- Aspect Ratio -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">アスペクト比</label>
                <select id="aspectRatio" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="1:1">正方形 (1:1)</option>
                    <option value="16:9">横長 (16:9)</option>
                    <option value="9:16">縦長 (9:16)</option>
                    <option value="4:3">標準 (4:3)</option>
                </select>
            </div>

            <!-- Reference Image -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">参考画像 (ポーズ・構図のヒント)</label>
                <div id="dropZone" class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 rounded-xl p-3 text-center cursor-pointer transition bg-slate-950/50 relative">
                    <input type="file" id="imageUpload" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div id="uploadPlaceholder" class="text-xs text-slate-400 space-y-1">
                        <i class="fa-solid fa-cloud-arrow-up text-indigo-400 text-base"></i>
                        <p>画像をアップロード (任意)</p>
                    </div>
                    <div id="imagePreviewContainer" class="hidden relative">
                        <img id="imagePreview" src="" class="max-h-20 mx-auto rounded-lg object-contain">
                        <button id="removeImage" type="button" class="absolute top-0 right-0 bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center shadow">×</button>
                    </div>
                </div>
                <p class="text-[10px] text-slate-500">※画像はそのままコピーせず、構図やポーズの参考としてのみ利用されます。</p>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-500/20 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic"></i>
                <span>画像を生成する</span>
            </button>
        </section>

        <!-- Preview / Workspace Panel -->
        <section class="lg:col-span-2 flex flex-col space-y-4">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl flex-1 flex flex-col items-center justify-center p-6 min-h-[420px] relative overflow-hidden">
                
                <!-- Loading State -->
                <div id="loadingState" class="hidden flex flex-col items-center space-y-3">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-slate-400">Geminiが新しい画像を生成中です...</p>
                </div>

                <!-- Initial State -->
                <div id="initialState" class="text-center space-y-2 text-slate-500">
                    <i class="fa-solid fa-image text-4xl mb-2"></i>
                    <p class="text-sm">プロンプトを入力して「画像を生成する」を押してください</p>
                </div>

                <!-- Result Image Container -->
                <div id="resultContainer" class="hidden flex flex-col items-center space-y-4 w-full h-full">
                    <img id="resultImage" src="" class="max-h-[400px] w-auto rounded-xl shadow-2xl border border-slate-800 object-contain">
                    
                    <!-- Modification / Refinement Input (Restored!) -->
                    <div class="w-full bg-slate-950/80 border border-slate-800 rounded-xl p-3 space-y-2">
                        <label class="text-xs font-medium text-slate-400 flex items-center gap-1.5">
                            <i class="fa-solid fa-pen-nib text-indigo-400"></i> この画像をベースに再調整・追加指示する
                        </label>
                        <div class="flex gap-2">
                            <input type="text" id="refinePromptInput" placeholder="例: もう少し明るく、笑顔を強調して..." class="flex-1 bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
                            <button id="refineBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-xs font-medium transition flex items-center gap-1">
                                <i class="fa-solid fa-arrow-rotate-right"></i> 更新
                            </button>
                        </div>
                    </div>

                    <div class="flex space-x-3">
                        <a id="downloadBtn" download="generated-image.png" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-medium flex items-center space-x-2 transition border border-slate-700">
                            <i class="fa-solid fa-download"></i>
                            <span>画像をダウンロード</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- API Key Modal -->
    <div id="apiKeyModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-key text-indigo-400"></i> Gemini APIキーの設定
                </h3>
                <button id="closeApiKeyModal" class="text-slate-400 hover:text-white text-sm"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-xs text-slate-400">
                Google AI Studioで取得したAPIキーを入力してください。キーはブラウザのローカルストレージにのみ保存されます。
            </p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <div class="flex justify-end space-x-2 pt-2">
                <button id="saveApiKey" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-medium transition">保存する</button>
            </div>
        </div>
    </div>

    <script>
        const apiKeyModal = document.getElementById('apiKeyModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        
        // Load API Key
        const savedKey = localStorage.getItem('gemini_image_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        } else {
            apiKeyModal.classList.remove('hidden');
        }

        document.getElementById('openApiKeyModal').addEventListener('click', () => apiKeyModal.classList.remove('hidden'));
        document.getElementById('closeApiKeyModal').addEventListener('click', () => apiKeyModal.classList.add('hidden'));
        document.getElementById('saveApiKey').addEventListener('click', () => {
            if (apiKeyInput.value.trim()) {
                localStorage.setItem('gemini_image_api_key', apiKeyInput.value.trim());
                apiKeyModal.classList.add('hidden');
            } else {
                alert('APIキーを入力してください');
            }
        });

        let base64Image = null;
        let currentLatestImageBase64 = null;

        // Image Upload Handler
        const imageUpload = document.getElementById('imageUpload');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImage = document.getElementById('removeImage');

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    base64Image = uploadEvent.target.result.split(',')[1];
                    imagePreview.src = uploadEvent.target.result;
                    uploadPlaceholder.classList.add('hidden');
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImage.addEventListener('click', () => {
            base64Image = null;
            imageUpload.value = '';
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
        });

        // Core Generation Function
        async function generateImage(promptText, useImageAsReference = true) {
            const apiKey = localStorage.getItem('gemini_image_api_key');
            if (!apiKey) {
                apiKeyModal.classList.remove('hidden');
                alert('APIキーを設定してください。');
                return;
            }
            if (!promptText) {
                alert('プロンプトを入力してください。');
                return;
            }

            const style = document.getElementById('styleSelect').value;
            const aspectRatio = document.getElementById('aspectRatio').value;

            // Strict instructions to prevent copying reference image literally, treating it only as pose/composition guide
            let finalPrompt = `Create a brand new original image based on this core instruction: "${promptText}". `;
            if (style) {
                finalPrompt += `Apply the following artistic style strictly: ${style}. `;
            }
            finalPrompt += `Aspect ratio target: ${aspectRatio}. `;
            
            if (useImageAsReference && base64Image) {
                finalPrompt += `Note: An optional reference image is provided. DO NOT copy or duplicate the reference image directly. Use it strictly and abstractly as a loose reference for character posing, composition, or general layout inspiration only, while completely redesigning the background, setting, lighting, clothing, and art style according to the prompt instructions.`;
            }

            const loadingState = document.getElementById('loadingState');
            const initialState = document.getElementById('initialState');
            const resultContainer = document.getElementById('resultContainer');

            initialState.classList.add('hidden');
            resultContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                let contents = [];
                if (useImageAsReference && base64Image) {
                    contents.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: base64Image
                        }
                    });
                }
                contents.push({ text: finalPrompt });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: contents }],
                        generationConfig: {
                            responseModalities: ["TEXT", "IMAGE"]
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let imageUrl = null;
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    for (const part of data.candidates[0].content.parts) {
                        if (part.inlineData) {
                            imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                            break;
                        }
                    }
                }

                if (imageUrl) {
                    currentLatestImageBase64 = imageUrl;
                    document.getElementById('resultImage').src = imageUrl;
                    document.getElementById('downloadBtn').href = imageUrl;
                    loadingState.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error("画像データが取得できませんでした。プロンプトを調整してお試しください。");
                }

            } catch (error) {
                loadingState.classList.add('hidden');
                initialState.classList.remove('hidden');
                alert('エラーが発生しました: ' + error.message);
            }
        }

        // Generate Handler
        document.getElementById('generateBtn').addEventListener('click', () => {
            const promptText = document.getElementById('promptInput').value.trim();
            generateImage(promptText, true);
        });

        // Refine / Update Handler
        document.getElementById('refineBtn').addEventListener('click', () => {
            const refineText = document.getElementById('refinePromptInput').value.trim();
            const originalPrompt = document.getElementById('promptInput').value.trim();
            if (!refineText) {
                alert('追加の調整指示を入力してください。');
                return;
            }
            generateImage(`${originalPrompt}. Additional adjustments: ${refineText}`, false);
        });
    </script>
</body>
</html>
