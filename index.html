<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Image Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-500 to-purple-500 p-2 rounded-xl text-white shadow-lg">
                    <i class="fa-solid fa-wand-magic-sparkles text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Gemini Image Studio</h1>
                    <p class="text-xs text-slate-400">AI Image Generation & Editor</p>
                </div>
            </div>
            <div class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700/50 flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Family Ready</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Controls Panel -->
        <section class="md:col-span-1 space-y-4 bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl h-fit">
            <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-sliders text-indigo-400"></i> 生成設定
            </h2>

            <!-- API Key (Configured for Family) -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">API Key</label>
                <input type="password" id="apiKeyInput" placeholder="APIキーを入力" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500" value="">
            </div>

            <!-- Prompt -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">プロンプト (指示文)</label>
                <textarea id="promptInput" rows="4" placeholder="例: 綺麗な夕暮れの海岸を走るスポーツカー、フォトリアル..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 resize-none"></textarea>
            </div>

            <!-- Style Preset -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">画風スタイル</label>
                <select id="styleSelect" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="">指定なし (標準)</option>
                    <option value="photorealistic, highly detailed, 8k resolution">フォトリアル (実写風)</option>
                    <option value="anime style, vibrant colors, clean lines">アニメ調</option>
                    <option value="watercolor painting, soft brush strokes, artistic">水彩画風</option>
                    <option value="cyberpunk style, neon lights, futuristic">サイバーパンク</option>
                    <option value="3d render, blender, claymation style">3Dレンダリング</option>
                </select>
            </div>

            <!-- Aspect Ratio -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">アスペクト比</label>
                <select id="aspectRatio" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    <option value="1:1">正方形 (1:1)</option>
                    <option value="16:9">横長 (16:9)</option>
                    <option value="9:16">縦長 (9:16)</option>
                </select>
            </div>

            <!-- Reference Image -->
            <div class="space-y-1.5">
                <label class="text-xs font-medium text-slate-400">参考画像 (オプション)</label>
                <div id="dropZone" class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 rounded-xl p-3 text-center cursor-pointer transition bg-slate-950/50 relative">
                    <input type="file" id="imageUpload" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer">
                    <div id="uploadPlaceholder" class="text-xs text-slate-400 space-y-1">
                        <i class="fa-solid fa-cloud-arrow-up text-indigo-400 text-base"></i>
                        <p>画像をドラッグまたはクリック</p>
                    </div>
                    <div id="imagePreviewContainer" class="hidden relative">
                        <img id="imagePreview" src="" class="max-h-24 mx-auto rounded-lg object-contain">
                        <button id="removeImage" type="button" class="absolute top-0 right-0 bg-red-600 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center shadow">×</button>
                    </div>
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-500/20 transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-wand-magic"></i>
                <span>画像を生成する</span>
            </button>
        </section>

        <!-- Preview / Workspace Panel -->
        <section class="md:col-span-2 flex flex-col space-y-4">
            <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl flex-1 flex flex-col items-center justify-center p-6 min-h-[400px] relative overflow-hidden">
                
                <!-- Loading State -->
                <div id="loadingState" class="hidden flex flex-col items-center space-y-3">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-slate-400">Geminiが画像を生成中です...</p>
                </div>

                <!-- Initial State -->
                <div id="initialState" class="text-center space-y-2 text-slate-500">
                    <i class="fa-solid fa-image text-4xl mb-2"></i>
                    <p class="text-sm">プロンプトを入力して「画像を生成する」を押してください</p>
                </div>

                <!-- Result Image Container -->
                <div id="resultContainer" class="hidden flex flex-col items-center space-y-4 w-full h-full">
                    <img id="resultImage" src="" class="max-h-[450px] w-auto rounded-xl shadow-2xl border border-slate-800 object-contain">
                    <div class="flex space-x-3">
                        <a id="downloadBtn" download="generated-image.png" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-xl text-xs font-medium flex items-center space-x-2 transition border border-slate-700">
                            <i class="fa-solid fa-download"></i>
                            <span>画像をダウンロード</span>
                        </a>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        const DEFAULT_API_KEY = "ここにご自身のGoogle AI StudioのAPIキーを入力";
        
        document.getElementById('apiKeyInput').value = DEFAULT_API_KEY;

        let base64Image = null;

        // Image Upload Handler
        const imageUpload = document.getElementById('imageUpload');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const imagePreview = document.getElementById('imagePreview');
        const removeImage = document.getElementById('removeImage');

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (uploadEvent) => {
                    base64Image = uploadEvent.target.result.split(',')[1];
                    imagePreview.src = uploadEvent.target.result;
                    uploadPlaceholder.classList.add('hidden');
                    imagePreviewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        removeImage.addEventListener('click', () => {
            base64Image = null;
            imageUpload.value = '';
            imagePreview.src = '';
            imagePreviewContainer.classList.add('hidden');
            uploadPlaceholder.classList.remove('hidden');
        });

        // Generate Handler
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            let promptText = document.getElementById('promptInput').value.trim();
            const style = document.getElementById('styleSelect').value;

            if (!apiKey) {
                alert('APIキーを入力してください。');
                return;
            }
            if (!promptText) {
                alert('プロンプトを入力してください。');
                return;
            }

            if (style) {
                promptText += `, Style: ${style}`;
            }

            const loadingState = document.getElementById('loadingState');
            const initialState = document.getElementById('initialState');
            const resultContainer = document.getElementById('resultContainer');

            initialState.classList.add('hidden');
            resultContainer.classList.add('hidden');
            loadingState.classList.remove('hidden');

            try {
                let contents = [];
                if (base64Image) {
                    contents.push({
                        inlineData: {
                            mimeType: "image/jpeg",
                            data: base64Image
                        }
                    });
                }
                contents.push({ text: promptText });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: contents }],
                        generationConfig: {
                            responseModalities: ["TEXT", "IMAGE"]
                        }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let imageUrl = null;
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts) {
                    for (const part of data.candidates[0].content.parts) {
                        if (part.inlineData) {
                            imageUrl = `data:${part.inlineData.mimeType};base64,${part.inlineData.data}`;
                            break;
                        }
                    }
                }

                if (imageUrl) {
                    document.getElementById('resultImage').src = imageUrl;
                    document.getElementById('downloadBtn').href = imageUrl;
                    loadingState.classList.add('hidden');
                    resultContainer.classList.remove('hidden');
                } else {
                    throw new Error("画像データが取得できませんでした。プロンプトを調整してお試しください。");
                }

            } catch (error) {
                loadingState.classList.add('hidden');
                initialState.classList.remove('hidden');
                alert('エラーが発生しました: ' + error.message);
            }
        });
    </script>
</body>
</html>
